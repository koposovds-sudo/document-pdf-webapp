<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конвертер в PDF</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <span class="badge">Без аккаунта · файлы удаляются после обработки</span>
    <h1>Конвертер документов в PDF</h1>
    <p class="intro">Загрузите Word, Excel или JPEG. Максимум 20 файлов и 50 МБ на файл.</p>
    <form id="converter-form">
      <label class="dropzone" for="files">
        <input id="files" name="files" type="file" multiple required accept=".doc,.docx,.xls,.xlsx,.jpg,.jpeg">
        <span class="dropzone-title">Выберите или перетащите файлы</span>
        <span class="dropzone-help">DOC, DOCX, XLS, XLSX, JPG, JPEG</span>
      </label>
      <div id="selected-files" class="selected-files" aria-live="polite"></div>
      <fieldset>
        <legend>Как отдать результат?</legend>
        <label class="choice"><input type="radio" name="output_mode" value="separate" checked><span><strong>Отдельные PDF</strong><small>Несколько результатов будут скачаны ZIP-архивом.</small></span></label>
        <label class="choice"><input type="radio" name="output_mode" value="merged"><span><strong>Объединить всё в один PDF</strong><small>Документы попадут в итоговый файл в порядке загрузки. Все JPEG станут одним многостраничным блоком.</small></span></label>
      </fieldset>
      <button id="submit-button" type="submit">Конвертировать</button>
      <p id="status" class="status" role="status"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#converter-form');
    const input = document.querySelector('#files');
    const selected = document.querySelector('#selected-files');
    const status = document.querySelector('#status');
    const button = document.querySelector('#submit-button');
    input.addEventListener('change', () => {
      const files = [...input.files];
      selected.textContent = files.length ? `Выбрано файлов: ${files.length}. ${files.map(file => file.name).join(' · ')}` : '';
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!input.files.length) return;
      const payload = new FormData(form);
      button.disabled = true;
      status.textContent = 'Конвертируем файлы. Не закрывайте эту вкладку…';
      try {
        const response = await fetch('/api/convert', { method: 'POST', body: payload });
        if (!response.ok) {
          let message = 'Не удалось обработать файлы.';
          try { const data = await response.json(); message = data.detail || message; } catch (_) {}
          throw new Error(message);
        }
        const blob = await response.blob();
        const disposition = response.headers.get('content-disposition') || '';
        const match = disposition.match(/filename="?([^";]+)"?/i);
        const name = match ? match[1] : 'converted_document.pdf';
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = name; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
        status.textContent = 'Готово: скачивание началось.';
      } catch (error) {
        status.textContent = `Ошибка: ${error.message}`;
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
